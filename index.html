    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #0a0a0f;
            --card: rgba(20, 20, 35, 0.85);
            --card-border: rgba(255, 255, 255, 0.06);
            --text: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --gradient: linear-gradient(135deg, #ff416c, #ff4b2b);
            --green: #00ff88;
            --radius: 20px;
            --radius-sm: 12px;
        }
        
        html, body {
            height: 100%;
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(255, 65, 108, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(168, 85, 247, 0.06) 0%, transparent 50%);
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            overflow-y: auto;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 16px;
        }

        .logo {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -1px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .logo-sub {
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: -10px;
            margin-bottom: 6px;
        }

        /* Кнопка */
        .talk-btn-wrap {
            position: relative;
            margin: 6px 0;
        }
        
        .talk-btn-glow {
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            background: var(--gradient);
            opacity: 0;
            filter: blur(30px);
            transition: opacity 0.4s;
            pointer-events: none;
        }
        
        .talk-btn-wrap.active .talk-btn-glow { opacity: 0.6; }
        
        .talk-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(20, 20, 35, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            outline: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1;
        }
        
        .talk-btn:active { transform: scale(0.94); }
        
        .talk-btn.active {
            background: var(--gradient);
            border-color: transparent;
            box-shadow: 0 0 60px rgba(255, 65, 108, 0.5), 0 0 120px rgba(255, 75, 43, 0.3);
            transform: scale(0.96);
        }
        
        .talk-btn.locked {
            animation: pulse-glow 2s infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 65, 108, 0.3), 0 0 80px rgba(255, 75, 43, 0.2); }
            50% { box-shadow: 0 0 70px rgba(255, 65, 108, 0.6), 0 0 140px rgba(255, 75, 43, 0.4); }
        }

        .btn-text { z-index: 2; pointer-events: none; }
        .talk-btn.active .btn-text { font-size: 28px; }
        
        .lock-badge {
            position: absolute;
            top: 14px; right: 18px;
            font-size: 14px;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
            padding: 4px 8px;
            border-radius: 10px;
        }
        .talk-btn.locked .lock-badge { opacity: 1; }

        /* Режим */
        .mode-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card);
            border: 1px solid var(--card-border);
            padding: 10px 18px;
            border-radius: 50px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .mode-label-text { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.1);
            border-radius: 26px;
            transition: 0.3s;
        }
        .slider:before {
            content: "";
            position: absolute;
            height: 20px; width: 20px;
            left: 3px; bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        input:checked + .slider { background: var(--gradient); }
        input:checked + .slider:before { transform: translateX(22px); }
        
        .mode-indicator {
            font-size: 13px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            min-width: 40px;
            text-align: right;
        }

        /* Карточка AirPlay */
        .airplay-card {
            width: 100%;
            background: var(--card);
            border: 2px solid rgba(255, 65, 108, 0.3);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .airplay-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .airplay-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .airplay-info {
            flex: 1;
        }

        .airplay-title {
            font-size: 13px;
            font-weight: 700;
        }

        .airplay-subtitle {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .airplay-btn {
            width: 100%;
            padding: 14px;
            background: var(--gradient);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-family: -apple-system, sans-serif;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(255, 65, 108, 0.3);
        }
        .airplay-btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 10px rgba(255, 65, 108, 0.2);
        }

        .airplay-status {
            font-size: 10px;
            color: var(--text-secondary);
            text-align: center;
            min-height: 14px;
        }
        .airplay-status.connected {
            color: var(--green);
            font-weight: 600;
        }

        /* Карточки */
        .card {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .card-title {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Эхо */
        .echo-slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .echo-label {
            font-size: 11px;
            color: var(--text-secondary);
            min-width: 45px;
            font-weight: 500;
        }

        .echo-slider {
            -webkit-appearance: none;
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
            cursor: pointer;
        }

        .echo-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: white;
            border: 2px solid #ff416c;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 65, 108, 0.3);
        }

        .echo-value {
            font-size: 11px;
            font-weight: 600;
            color: #ff416c;
            min-width: 30px;
            text-align: right;
        }

        /* Усиление */
        .gain-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, #00ff88, #ff9f43 40%, #ff416c 70%, #ff0000);
            outline: none;
            cursor: pointer;
        }
        
        .gain-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: white;
            border: 3px solid #ff416c;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 65, 108, 0.4);
        }

        .gain-value {
            font-size: 16px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gain-labels {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.3);
        }

        .status {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            min-height: 18px;
            font-weight: 500;
        }
        .status.active { color: var(--green); font-weight: 600; }
        .status.error { color: #ff416c; font-weight: 600; }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: -apple-system, sans-serif;
        }
        .btn-outline:active { background: rgba(255, 255, 255, 0.05); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">MegaFon</div>
        <div class="logo-sub">Voice Amplifier</div>

        <!-- AirPlay карточка -->
        <div class="airplay-card" id="airplayCard">
            <div class="airplay-header">
                <div class="airplay-icon">📡</div>
                <div class="airplay-info">
                    <div class="airplay-title">Вывод звука</div>
                    <div class="airplay-subtitle" id="airplaySubtitle">Выберите колонку</div>
                </div>
            </div>
            <button class="airplay-btn" id="airplayBtn">
                📡 Выбрать устройство
            </button>
            <div class="airplay-status" id="airplayStatus"></div>
        </div>

        <div class="mode-card">
            <span class="mode-label-text">Режим</span>
            <label class="switch">
                <input type="checkbox" id="modeSwitch">
                <span class="slider"></span>
            </label>
            <span class="mode-indicator" id="modeIndicator">Рация</span>
        </div>

        <div class="talk-btn-wrap" id="talkBtnWrap">
            <div class="talk-btn-glow"></div>
            <button id="talkBtn" class="talk-btn">
                <span class="btn-text">ГОВОРИ</span>
                <span class="lock-badge">🔒</span>
            </button>
        </div>

        <div class="status" id="status">Выберите колонку и нажмите ГОВОРИ</div>

        <!-- Эхо -->
        <div class="card">
            <div class="card-title">🔇 Подавление эха</div>
            <div class="echo-slider-row">
                <span class="echo-label">Порог</span>
                <input type="range" class="echo-slider" id="noiseGateSlider" 
                       min="1" max="80" value="20">
                <span class="echo-value" id="noiseGateValue">20%</span>
            </div>
            <div class="echo-slider-row">
                <span class="echo-label">Атака</span>
                <input type="range" class="echo-slider" id="attackSlider" 
                       min="1" max="50" value="5">
                <span class="echo-value" id="attackValue">5ms</span>
            </div>
        </div>

        <!-- Усиление -->
        <div class="card">
            <div class="card-title">🔊 Усиление</div>
            <span class="gain-value" id="gainValue">1.5x</span>
            <input type="range" class="gain-slider" id="gainSlider" 
                   min="0.5" max="10.0" step="0.1" value="1.5">
            <div class="gain-labels">
                <span>0.5x</span><span>5x</span><span>10x MAX</span>
            </div>
        </div>

        <button class="btn-outline" id="resetBtn">🔄 Сброс</button>
    </div>

    <!-- Скрытый video элемент для AirPlay -->
    <video id="airplayVideo" 
           style="display:none;position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;"
           playsinline 
           webkit-playsinline 
           x-webkit-airplay="allow"
           src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMWlzb28AAAAQaXNvbQAAAAAAABoAAACIAAAAAQAAAAAAAAA=">
    </video>

    <script>
        // ==================== SERVICE WORKER ====================
        if ('serviceWorker' in navigator) {
            const swCode = `const C='megafon-v7';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['/'])).then(()=>self.skipWaiting()))});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.map(k=>k!==C?caches.delete(k):null))).then(()=>self.clients.claim()))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})`;
            navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'application/javascript'})),{scope:'/'});
        }

        // ==================== DOM ====================
        const talkBtnWrap = document.getElementById('talkBtnWrap');
        const talkBtn = document.getElementById('talkBtn');
        const btnText = talkBtn.querySelector('.btn-text');
        const statusDiv = document.getElementById('status');
        const modeSwitch = document.getElementById('modeSwitch');
        const modeIndicator = document.getElementById('modeIndicator');
        const gainSlider = document.getElementById('gainSlider');
        const gainValue = document.getElementById('gainValue');
        const noiseGateSlider = document.getElementById('noiseGateSlider');
        const noiseGateValue = document.getElementById('noiseGateValue');
        const attackSlider = document.getElementById('attackSlider');
        const attackValue = document.getElementById('attackValue');
        const airplayBtn = document.getElementById('airplayBtn');
        const airplayStatus = document.getElementById('airplayStatus');
        const airplaySubtitle = document.getElementById('airplaySubtitle');
        const airplayVideo = document.getElementById('airplayVideo');
        const resetBtn = document.getElementById('resetBtn');

        // ==================== СОСТОЯНИЕ ====================
        let audioContext = null;
        let mediaStream = null;
        let gainNode = null;
        let sourceNode = null;
        let noiseGateNode = null;
        let keepAliveTimer = null;
        
        let isLocked = false;
        let isMicOn = false;
        let isInitialized = false;

        // ==================== ФУНКЦИИ ====================
        function setStatus(text, cls = '') {
            statusDiv.textContent = text;
            statusDiv.className = 'status ' + cls;
        }

        function updateUI() {
            talkBtn.classList.toggle('active', isMicOn);
            talkBtn.classList.toggle('locked', isMicOn && isLocked);
            talkBtnWrap.classList.toggle('active', isMicOn);
            
            if (isLocked && isMicOn) {
                btnText.textContent = '📢';
            } else if (isLocked && !isMicOn) {
                btnText.textContent = 'ВКЛ';
            } else if (!isLocked && isMicOn) {
                btnText.textContent = '📢';
            } else {
                btnText.textContent = 'ГОВОРИ';
            }
            
            modeIndicator.textContent = isLocked ? 'Фикс' : 'Рация';
        }

        function createNoiseGate(threshold, attackMs) {
            const bufferSize = 512;
            const node = audioContext.createScriptProcessor(bufferSize, 1, 1);
            
            let envelope = 0;
            const attackCoef = Math.exp(-1 / (audioContext.sampleRate * (attackMs / 1000)));
            const releaseCoef = Math.exp(-1 / (audioContext.sampleRate * 0.12));
            
            node.onaudioprocess = (event) => {
                const input = event.inputBuffer.getChannelData(0);
                const output = event.outputBuffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    const abs = Math.abs(input[i]);
                    envelope = abs > envelope 
                        ? attackCoef * envelope + (1 - attackCoef) * abs 
                        : releaseCoef * envelope;
                    
                    output[i] = envelope < threshold ? 0 : input[i];
                }
            };
            
            return node;
        }

        function startKeepAlive() {
            stopKeepAlive();
            keepAliveTimer = setInterval(() => {
                if (!isMicOn || !audioContext || audioContext.state === 'closed') return;
                if (audioContext.state === 'suspended') {
                    audioContext.resume().catch(()=>{});
                }
            }, 2000);
        }

        function stopKeepAlive() {
            if (keepAliveTimer) { clearInterval(keepAliveTimer); keepAliveTimer = null; }
        }

        // ==================== AIRPLAY ====================
        
        function showAirPlayPicker() {
            airplayStatus.textContent = 'Открываю меню выбора...';
            airplayStatus.className = 'airplay-status';
            
            // Способ 1: через video элемент
            if (airplayVideo.webkitShowPlaybackTargetPicker) {
                airplayVideo.play().then(() => {
                    airplayVideo.webkitShowPlaybackTargetPicker();
                    airplayStatus.textContent = 'Выберите колонку в меню выше';
                    airplayStatus.className = 'airplay-status';
                }).catch(() => {
                    // Способ 2: через временный элемент
                    tryAlternativeAirPlay();
                });
            } else {
                tryAlternativeAirPlay();
            }
        }
        
        function tryAlternativeAirPlay() {
            const tv = document.createElement('video');
            tv.setAttribute('playsinline', '');
            tv.setAttribute('webkit-playsinline', '');
            tv.setAttribute('x-webkit-airplay', 'allow');
            tv.src = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMWlzb28AAAAQaXNvbQAAAAAAABoAAACIAAAAAQAAAAAAAAA=';
            tv.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
            document.body.appendChild(tv);
            
            tv.play().then(() => {
                if (tv.webkitShowPlaybackTargetPicker) {
                    tv.webkitShowPlaybackTargetPicker();
                    airplayStatus.textContent = 'Выберите колонку в меню';
                    airplayStatus.className = 'airplay-status';
                } else {
                    airplayStatus.textContent = '⚠️ Откройте Пункт управления → AirPlay';
                    airplayStatus.className = 'airplay-status';
                }
            }).catch(() => {
                airplayStatus.textContent = 'Смахните вниз → AirPlay → колонка';
                airplayStatus.className = 'airplay-status';
            });
            
            setTimeout(() => {
                tv.pause();
                document.body.removeChild(tv);
            }, 3000);
        }

        function micOn() {
            if (!audioContext || audioContext.state === 'closed') return;
            audioContext.resume().then(() => {
                isMicOn = true;
                startKeepAlive();
                setStatus('📢 Говорите!', 'active');
                updateUI();
            }).catch(e => setStatus('❌ Ошибка', 'error'));
        }

        function micOff() {
            if (!audioContext || audioContext.state === 'closed') return;
            audioContext.suspend().then(() => {
                isMicOn = false;
                stopKeepAlive();
                setStatus(isLocked ? '🔒 Нажмите ВКЛ' : '🎤 Нажмите и говорите', '');
                updateUI();
            }).catch(e => {});
        }

        function pressButton() {
            if (!isInitialized) { initAudio(); return; }
            if (isLocked) { isMicOn ? micOff() : micOn(); }
            else { micOn(); }
        }

        function releaseButton() {
            if (!isInitialized || isLocked) return;
            micOff();
        }

        async function initAudio() {
            if (isInitialized) return;
            try {
                setStatus('Запуск...', '');
                talkBtn.disabled = true;
                btnText.textContent = '...';
                
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                    }
                });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                sourceNode = audioContext.createMediaStreamSource(mediaStream);
                
                const thresh = parseInt(noiseGateSlider.value) / 100;
                const attack = parseInt(attackSlider.value);
                noiseGateNode = createNoiseGate(thresh, attack);
                
                gainNode = audioContext.createGain();
                gainNode.gain.value = parseFloat(gainSlider.value);
                
                sourceNode.connect(noiseGateNode);
                noiseGateNode.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                await audioContext.suspend();
                
                isInitialized = true;
                talkBtn.disabled = false;
                
                if (isLocked) micOn();
                else setStatus('✅ Готово! Говорите', '');
                
                updateUI();
            } catch(err) {
                console.error(err);
                setStatus('❌ ' + (err.name === 'NotAllowedError' ? 'Доступ отклонен' : err.message), 'error');
                talkBtn.disabled = false;
                btnText.textContent = 'ГОВОРИ';
            }
        }

        function fullReset() {
            stopKeepAlive();
            isMicOn = false;
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            if (audioContext?.state !== 'closed') audioContext?.close();
            sourceNode = gainNode = noiseGateNode = audioContext = null;
            isInitialized = false;
            talkBtn.disabled = false;
            setStatus('Выберите колонку и нажмите ГОВОРИ', '');
            updateUI();
        }

        // ==================== СОБЫТИЯ ====================
        talkBtn.addEventListener('pointerdown', e => { e.preventDefault(); talkBtn.setPointerCapture(e.pointerId); pressButton(); });
        talkBtn.addEventListener('pointerup', e => { e.preventDefault(); releaseButton(); });
        talkBtn.addEventListener('pointerleave', () => releaseButton());
        talkBtn.addEventListener('pointercancel', () => releaseButton());
        talkBtn.addEventListener('contextmenu', e => e.preventDefault());

        airplayBtn.addEventListener('click', () => {
            showAirPlayPicker();
        });

        modeSwitch.addEventListener('change', () => {
            isLocked = modeSwitch.checked;
            if (isMicOn) micOff();
            setStatus(isLocked ? '🔒 Фиксация: нажмите ВКЛ' : '📻 Рация: держите кнопку', '');
            updateUI();
        });

        gainSlider.addEventListener('input', () => {
            const v = parseFloat(gainSlider.value);
            gainValue.textContent = v.toFixed(1) + 'x';
            if (gainNode) gainNode.gain.value = v;
        });

        noiseGateSlider.addEventListener('input', () => noiseGateValue.textContent = noiseGateSlider.value + '%');
        attackSlider.addEventListener('input', () => attackValue.textContent = attackSlider.value + 'ms');

        resetBtn.addEventListener('click', fullReset);

        window.addEventListener('beforeunload', () => {
            stopKeepAlive();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            audioContext?.close();
        });

        document.addEventListener('dblclick', e => e.preventDefault(), {passive: false});

        // Сохраняем настройки
        [gainSlider, noiseGateSlider, attackSlider].forEach(s => {
            const saved = localStorage.getItem('megafon_' + s.id);
            if (saved) s.value = saved;
            s.addEventListener('input', () => localStorage.setItem('megafon_' + s.id, s.value));
        });
        
        if (localStorage.getItem('megafon_gainSlider')) {
            gainValue.textContent = parseFloat(localStorage.getItem('megafon_gainSlider')).toFixed(1) + 'x';
        }

        // Определяем платформу
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        
        if (!isIOS) {
            airplaySubtitle.textContent = 'Работает автоматически';
            airplayBtn.textContent = '📡 Выбрать устройство';
        }
    </script>
</body>
</html>
