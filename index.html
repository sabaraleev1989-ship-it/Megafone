<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Мегафон Web</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            touch-action: manipulation; /* Убирает двойное нажатие */
        }
        .btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: #333;
            border: 4px solid #555;
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .btn:active, .btn.active {
            background: #e74c3c;
            border-color: #ff6b6b;
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255,0,0,0.5);
        }
        .status {
            margin-top: 30px;
            color: #aaa;
        }
        .warning {
            margin-top: 20px;
            color: #f1c40f;
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <button id="talkBtn" class="btn">ГОВОРИ</button>
    <div class="status" id="status">Нажмите кнопку и говорите</div>
    <div class="warning">⚠️ Подключите Bluetooth-колонку ДО нажатия.<br>Держите телефон на расстоянии от колонки!</div>

    <script>
        let audioContext = null;
        let mediaStream = null;
        let isActive = false;
        const btn = document.getElementById('talkBtn');
        const statusDiv = document.getElementById('status');

        // Функция старта аудио (обязательно по жесту пользователя)
        async function startAudio() {
            try {
                // 1. Создаем аудиоконтекст
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // 2. Получаем микрофон
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false, // ВАЖНО: Выключаем эхоподавление, иначе режет громкость
                        noiseSuppression: false, // Выключаем шумодав
                        autoGainControl: false    // Выключаем авторегулировку чувствительности
                    } 
                });
                
                // 3. Создаем источник из микрофона
                const source = audioContext.createMediaStreamSource(mediaStream);
                
                // 4. Усилитель (делаем громче)
                const gainNode = audioContext.createGain();
                gainNode.gain.value = 3.0; // Усиление в 3 раза (осторожно с эхом!)
                
                // 5. Подключаем к выходу (колонки/наушники)
                source.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                statusDiv.textContent = "Готово! Нажмите и держите кнопку.";
                btn.disabled = false;
                
            } catch (err) {
                console.error(err);
                statusDiv.textContent = "Ошибка доступа к микрофону: " + err.message;
            }
        }

        // События кнопки (Touch + Mouse для телефонов)
        function activate() {
            if (isActive) return;
            isActive = true;
            
            // Возобновляем контекст (правила браузеров)
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            btn.classList.add('active');
            statusDiv.textContent = "📢 ГОВОРИТЕ! (Отпустите для тишины)";
        }

        function deactivate() {
            if (!isActive) return;
            isActive = false;
            btn.classList.remove('active');
            statusDiv.textContent = "🔇 Микрофон заглушен";
            
            // Вместо отключения микрофона мы просто "суспендим" контекст, 
            // чтобы убить эхо, когда не говорим.
            // Это быстрее, чем пересоздавать поток.
            audioContext.suspend();
        }

        // Обработчики
        btn.addEventListener('mousedown', activate);
        btn.addEventListener('touchstart', activate, {passive: false});
        
        btn.addEventListener('mouseup', deactivate);
        btn.addEventListener('touchend', deactivate);
        btn.addEventListener('mouseleave', deactivate); // если палец соскользнул
        btn.addEventListener('touchcancel', deactivate);

        // Первый клик для запроса разрешения
        window.addEventListener('load', () => {
            btn.disabled = true;
            btn.textContent = "СТАРТ";
            statusDiv.textContent = "Нажмите 1 раз для включения микрофона";
            
            btn.addEventListener('click', function init() {
                startAudio();
                btn.textContent = "ГОВОРИ";
            }, { once: true }); // Только первый клик
        });
    </script>
</body>
</html>
